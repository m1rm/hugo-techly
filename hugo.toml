baseURL = 'https://m1rm.github.io/hugo-techly/'
locale = 'en-us'
title = 'Hugo Theme Techly'

[module]
  [[module.imports]]
    path = 'github.com/m1rm/techly/v2'
    version = 'v2.6.0'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts/'
    weight = 20
  [[menus.main]]
    name = 'Changelog'
    pageRef = '/changelog/'
    weight = 25
  [[menus.main]]
    name = 'About'
    pageRef = '/about/'
    weight = 30
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact/'
    weight = 40

[params]
  description = 'Showcase site for Techly, a Hugo theme inspired by clean developer-focused blogs.'
  mainSections = ['posts']

  [params.banner]
    heading = 'Hugo Theme Techly'
    subheading = 'A minimal Hugo theme for tech blogs — clean typography, responsive layout, and accessible by default.'

  [params.author]
    name = 'Miriam Müller'

  [params.footer]
    since = 2026
    tagline = 'Techly — a simple Hugo theme for tech blogs.'
    copyright = 'Miriam Müller'

  # A custom notice type on top of Techly's info, tip, warning and caution.
  # Used in the post "Techly 2.6.0: Notices".
  [params.notices.keep-in-mind]
    title = 'Keep in mind'
    icon = 'bookmark'
    color = { light = '#8250df', dark = '#ab7df8' }

  [params.newsletter]
    title = 'Stay up to date'
    text = 'Get notified when new versions are published.'
    url = 'https://github.com/m1rm/techly'
    label = 'View on GitHub'
    external = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"
  series = "series"
  year = "year"

[outputs]
  home = ["HTML", "RSS", "JSON"]
